<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .main-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }

    h4 {
      text-align: center;
      color: #4CAF50;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #4CAF50;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background: #45a049;
    }

    .btn-secondary {
      background: #2196F3;
      margin-top: 5px;
    }

    .btn-secondary:hover {
      background: #0b7dda;
    }

    .btn-danger {
      background: #f44336;
      padding: 5px 10px;
      font-size: 12px;
      width: auto;
      margin-left: 10px;
    }

    .btn-danger:hover {
      background: #da190b;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    li {
      background: #f8f9fa;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    li:hover {
      transform: translateX(5px);
      background: #e9ecef;
    }

    .expense-info {
      flex: 1;
    }

    .expense-amount {
      font-weight: bold;
      color: #4CAF50;
      font-size: 16px;
    }

    .expense-category {
      color: #666;
      font-size: 12px;
    }

    .right {
      background: white;
      border-radius: 15px;
      padding: 20px;
      width: 350px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .right h2 {
      text-decoration: underline;
      margin-bottom: 15px;
    }

    .right a {
      display: inline-block;
      margin: 10px 0;
      color: #2196F3;
      text-decoration: none;
    }

    .right a:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
    }

    .empty-message {
      text-align: center;
      color: #999;
      padding: 20px;
    }

    .total-expense {
      background: #4CAF50;
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
      .container, .right {
        width: 100%;
        max-width: 400px;
      }
    }
  </style>
</head>

<body>

<div class="main-container">
  <div class="container">
    <h4 id="dash">Loading...</h4>
    <h2> Add Expense</h2>

    <form id="form">
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="Enter amount" required />
      </div>
      
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="desc" placeholder="Enter description" required />
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="">Select Category</option>
          <option value="food"> Food</option>
          <option value="travel"> Travel</option>
          <option value="shopping"> Shopping</option>
          <option value="bills"> Bills</option>
          <option value="other"> Other</option>
        </select>
      </div>

      <button type="submit">+ Add Expense</button>
    </form>

    <div id="totalDisplay" class="total-expense" style="display: none;">
      Total: ₹<span id="totalAmount">0</span>
    </div>

    <ul id="list"></ul>
    <button onclick="showLeaderboard()" class="btn-secondary">🏆 Show Leaderboard</button>
  </div>

  <div class="right" style="display: none;">
    <h2>Leader Board</h2>
    <a href="../view/reports.html">📊 Generate Reports</a>
    <ul id="premium"></ul>
    <button onclick="closeLeaderboard()" class="btn-danger" style="margin-top: 10px;">Close</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
const API_BASE_URL = "http://localhost:3000";
let token = localStorage.getItem("token");
let currentPage = 1;
let isLoading = false;

function showError(message) {
  const errorDiv = document.createElement('div');
  errorDiv.className = 'error';
  errorDiv.textContent = message;
  document.querySelector('.container').insertBefore(errorDiv, document.getElementById('form'));
  setTimeout(() => errorDiv.remove(), 3000);
}

function showLoading(show) {
  isLoading = show;
}

function calculateTotal(expenses) {
  const total = expenses.reduce((sum, item) => sum + Number(item.amount), 0);
  const totalDisplay = document.getElementById('totalDisplay');
  const totalAmount = document.getElementById('totalAmount');
  
  if (expenses.length > 0) {
    totalDisplay.style.display = 'block';
    totalAmount.textContent = total.toFixed(2);
  } else {
    totalDisplay.style.display = 'none';
  }
}

async function getExpenses() {
  const list = document.getElementById("list");
  list.innerHTML = '<div class="loading">Loading expenses...</div>';

  try {
    const res = await axios.get(`${API_BASE_URL}/expense`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    const expenses = res.data.data || res.data || [];
    list.innerHTML = "";

    if (expenses.length === 0) {
      list.innerHTML = '<div class="empty-message">No expenses found. Add your first expense!</div>';
      calculateTotal([]);
      return;
    }

    calculateTotal(expenses);

    expenses.forEach((item) => {
      const li = document.createElement("li");
      
      const infoDiv = document.createElement("div");
      infoDiv.className = "expense-info";
      infoDiv.innerHTML = `
        <div class="expense-amount">₹${Number(item.amount).toFixed(2)}</div>
        <div class="expense-category"> ${item.category} • ${item.description || ''}</div>
      `;
      
      const btn = document.createElement("button");
      btn.innerText = "Delete";
      btn.className = "btn-danger";
      
      btn.addEventListener("click", async () => {
        if (confirm('Are you sure you want to delete this expense?')) {
          try {
            await axios.delete(`${API_BASE_URL}/expense/${item.id}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            await getExpenses();
          } catch (err) {
            console.error(err);
            showError("Failed to delete expense");
          }
        }
      });

      li.appendChild(infoDiv);
      li.appendChild(btn);
      list.appendChild(li);
    });

  } catch (err) {
    console.error(err);
    list.innerHTML = '<div class="error">Failed to load expenses. Please refresh the page.</div>';
    if (err.response?.status === 401) {
      alert("Session expired! Please login again.");
      localStorage.removeItem("token");
      window.location.href = "..view/login.html";
    }
  }
}

async function showLeaderboard() {
  const premium = document.getElementById("premium");
  const rightDiv = document.querySelector(".right");
  rightDiv.style.display = "block";
  premium.innerHTML = '<div class="loading">Loading leaderboard...</div>';
  
  try {
    const res = await axios.get(`${API_BASE_URL}/premium/show-leaderboard`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    
    const allExpenses = res.data || [];
    premium.innerHTML = "";
    
    if (allExpenses.length === 0) {
      premium.innerHTML = '<div class="empty-message">No data available</div>';
      return;
    }
    
    allExpenses.forEach((item, index) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="expense-info">
          <div class="expense-amount">#${index + 1} ${item.name}</div>
          <div class="expense-category">Total Expenses: ₹${Number(item.total_expense || 0).toFixed(2)}</div>
        </div>
      `;
      premium.appendChild(li);
    });
  } catch(err) {
    console.error(err);
    premium.innerHTML = '<div class="error">Failed to load leaderboard</div>';
  }
}

function closeLeaderboard() {
  document.querySelector(".right").style.display = "none";
}

function logout() {
  if (confirm('Are you sure you want to logout?')) {
    localStorage.removeItem("token");
    window.location.href = "../view/login.html";
  }
}

// ========== INITIALIZATION ==========
document.addEventListener("DOMContentLoaded", () => {
  if (!token) {
    alert("No token found! Please login.");
    window.location.href = "..view/login.html";
    return;
  }

  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    document.getElementById("dash").innerHTML = `👋 Welcome, ${payload.email} <button onclick="logout()" style="margin-left: 10px; padding: 5px 10px; width: auto; background: #f44336;">Logout</button>`;
    getExpenses();
  } catch (err) {
    console.error("Invalid token:", err);
    localStorage.removeItem("token");
    window.location.href = "../view/login.html";
  }

  // Form submit handler
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const amount = document.getElementById("amount").value;
    const description = document.getElementById("desc").value;
    const category = document.getElementById("category").value;

    if (!amount || !description) {
      showError("Please fill all fields");
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "Adding...";

    try {
      const data = {
        amount: Number(amount),
        description: description,
        category: category
      };
      
      await axios.post(`${API_BASE_URL}/expense`, data, {
        headers: { Authorization: `Bearer ${token}` }
      });
      alert('Expense Added')
      document.getElementById("amount").value = "";
      document.getElementById("desc").value = "";
      document.getElementById("category").value = "";
      
      await getExpenses();
      
    } catch (err) {
      console.error(err);
      showError(err.response?.data?.message || "Failed to add expense");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Add Expense";
    }
  });
});
</script>

</body>
</html>
