<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Report</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f7, #d9e4f5);
    margin: 0;
    padding: 10px;
  }

  .container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    animation: fadeIn 0.6s ease-in-out;
  }

  h2 {
    text-align: center;
    margin-bottom: 15px;
  }

  button {
    padding: 8px 14px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #0056b3;
    transform: scale(1.05);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    margin-top: 10px;
  }

  table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    animation: slideUp 0.5s ease;
  }

  th, td {
    padding: 10px;
    text-align: center;
  }

  th {
    background: #007bff;
    color: white;
  }

  tr {
    border-bottom: 1px solid #ddd;
    transition: 0.3s;
  }

  tr:hover {
    background: #f1f7ff;
  }

  .total {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    text-align: right;
  }

  #pages {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }

  #pages button {
    background: #eee;
    color: black;
  }

  /* 🔥 Animations */
  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
  }

  @keyframes slideUp {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  /* 📱 Mobile Responsive */
  @media (max-width: 600px) {
    table, thead, tbody, th, td, tr {
      display: block;
    }

    thead {
      display: none;
    }

    tr {
      margin-bottom: 10px;
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.05);
    }

    td {
      text-align: left;
      padding: 8px;
      position: relative;
    }

    td::before {
      content: attr(data-label);
      font-weight: bold;
      display: block;
      color: #555;
    }
  }
</style>
</head>

<body>

<div class="container">

<h2>Expense Report</h2>

<button onclick="generateReport(1)">Load Report</button>
<button onclick="downloadReport()">Download</button>

<div class="controls">
  <button onclick="prevPage()">Prev</button>
  <span id="pages"></span>
  <button onclick="nextPage()">Next</button>
</div>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Category</th>
      <th>Expense (₹)</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<div class="total" id="total"></div>

</div>
<a href="../expense.html">Back to expense</a>
<script>
let currentPage = 1;
let totalPages = 1;
const limit = 3;

async function generateReport(page) {

  const url = `http://localhost:3000/expense/${page}/${limit}`;

  console.log("Fetching:", url);

  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${localStorage.getItem("token")}`
    }
  });

  const data = await res.json();

  console.log("Response:", data);

  const expenses = data.data || [];

  currentPage = data.currentPage;
  totalPages = data.totalPages;

  let rows = "";
  let total = 0;

  expenses.forEach(exp => {
    total += Number(exp.amount);

    rows += `
      <tr>
        <td>${new Date(exp.createdAt).toLocaleDateString()}</td>
        <td>${exp.description}</td>
        <td>${exp.category}</td>
        <td>${exp.amount}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = rows;
  document.getElementById("total").innerText = "Total: ₹ " + total;

  renderPages();
}

function renderPages() {
  let html = "";

  for (let i = 1; i <= totalPages; i++) {
    html += `
      <button onclick="goToPage(${i})"
        style="
          background:${i === currentPage ? '#007bff' : '#eee'};
          color:${i === currentPage ? 'white' : 'black'};
        ">
        ${i}
      </button>
    `;
  }

  document.getElementById("pages").innerHTML = html;
}

function goToPage(page) {
  generateReport(page);
}

function nextPage() {
  if (currentPage < totalPages) {
    generateReport(currentPage + 1);
  }
}

function prevPage() {
  if (currentPage > 1) {
    generateReport(currentPage - 1);
  }
}
async function downloadReport() {
  try {
    const res = await fetch("http://localhost:3000/expense/download", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${localStorage.getItem("token")}`
      }
    });

    if (!res.ok) {
      throw new Error("Server error");
    }

    const data = await res.json();

    if (data.url) {
      alert("Report generated successfully!");
      console.log("S3 URL:", data.url);

      window.open(data.url, "_blank");
    } else {
      alert("No URL received");
    }

  } catch (error) {
    console.error("Error:", error);
    alert("Failed to generate report");
  }
}
</script>

</body>
</html>
