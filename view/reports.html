<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Expense Report</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
    padding: 20px;
    color: #333;
  }

  .container {
    max-width: 950px;
    margin: auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    animation: fadeIn 0.6s ease-in-out;
  }

  h2 {
    text-align: center;
    margin-bottom: 10px;
    color: #2a5298;
  }

  /* Top Buttons */
  .top-actions {
    text-align: center;
    margin-bottom: 10px;
  }

  button {
    padding: 9px 16px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #4facfe, #00c6ff);
    color: white;
    cursor: pointer;
    transition: 0.3s;
    font-weight: 500;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.2);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }

  /* Table */
  table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    overflow: hidden;
    border-radius: 10px;
  }

  th, td {
    padding: 12px;
    text-align: center;
  }

  th {
    background: linear-gradient(135deg, #4facfe, #00c6ff);
    color: white;
    font-weight: 600;
  }

  tr {
    border-bottom: 1px solid #eee;
    transition: 0.3s;
  }

  tr:nth-child(even) {
    background: #f8fbff;
  }

  tr:hover {
    background: #eaf4ff;
  }

  .total {
    margin-top: 18px;
    font-size: 18px;
    font-weight: bold;
    text-align: right;
    color: #2a5298;
  }

  /* Pagination */
  #pages {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }

  #pages button {
    background: #eef3ff;
    color: #333;
    border: 1px solid #d0dfff;
  }

  #pages button:hover {
    background: #4facfe;
    color: white;
  }

  /* Back link */
  a {
    display: block;
    text-align: center;
    margin-top: 15px;
    text-decoration: none;
    color: #4facfe;
    font-weight: bold;
  }

  a:hover {
    text-decoration: underline;
  }

  /* Animations */
  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
  }

  /* Mobile */
  @media (max-width: 600px) {
    body {
      padding: 10px;
    }

    table, thead, tbody, th, td, tr {
      display: block;
    }

    thead {
      display: none;
    }

    tr {
      margin-bottom: 12px;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.08);
    }

    td {
      text-align: left;
      padding: 8px;
      position: relative;
    }

    td::before {
      content: attr(data-label);
      font-weight: bold;
      display: block;
      color: #666;
      margin-bottom: 2px;
    }
  }
</style>
</head>

<body>

<div class="container">

<h2>📊 AI Expense Report</h2>

<div class="top-actions">
  <button onclick="generateReport(1)">Load Report</button>
  <button onclick="downloadReport()">Download</button>
</div>

<div class="controls">
  <button onclick="prevPage()">Prev</button>
  <span id="pages"></span>
  <button onclick="nextPage()">Next</button>
</div>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Category</th>
      <th>Expense (₹)</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<div class="total" id="total"></div>

</div>

<a href="../view/expense.html">⬅ Back to expense</a>

<script>
const API_BASE_URL = 'http://localhost:3000';
let currentPage = 1;
let totalPages = 1;
const limit = 3;

async function generateReport(page) {

  const url = `${API_BASE_URL}/expense/${page}/${limit}`;

  console.log("Fetching:", url);

  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${localStorage.getItem("token")}`
    }
  });

  const data = await res.json();

  console.log("Response:", data);

  const expenses = data.data || [];

  currentPage = data.currentPage;
  totalPages = data.totalPages;

  let rows = "";
  let total = 0;

  expenses.forEach(exp => {
    total += Number(exp.amount);

    rows += `
      <tr>
        <td>${new Date(exp.createdAt).toLocaleDateString()}</td>
        <td>${exp.description}</td>
        <td>${exp.category}</td>
        <td>${exp.amount}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = rows;
  document.getElementById("total").innerText = "Total: ₹ " + total;

  renderPages();
}

function renderPages() {
  let html = "";

  for (let i = 1; i <= totalPages; i++) {
    html += `
      <button onclick="goToPage(${i})"
        style="
          background:${i === currentPage ? '#4facfe' : '#eef3ff'};
          color:${i === currentPage ? 'white' : '#333'};
        ">
        ${i}
      </button>
    `;
  }

  document.getElementById("pages").innerHTML = html;
}

function goToPage(page) {
  generateReport(page);
}

function nextPage() {
  if (currentPage < totalPages) {
    generateReport(currentPage + 1);
  }
}

function prevPage() {
  if (currentPage > 1) {
    generateReport(currentPage - 1);
  }
}

async function downloadReport() {
  try {
    const res = await fetch(`${API_BASE_URL}/expense/download`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${localStorage.getItem("token")}`
      }
    });

    if (!res.ok) {
      throw new Error("Server error");
    }

    const data = await res.json();

    if (data.url) {
      alert("Report generated successfully!");
      console.log("S3 URL:", data.url);

      window.open(data.url, "_blank");
    } else {
      alert("No URL received");
    }

  } catch (error) {
    console.error("Error:", error);
    alert("Failed to generate report");
  }
}
</script>

</body>
</html>
