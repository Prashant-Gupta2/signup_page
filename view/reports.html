<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Report</title>

<style>
  body {
    font-family: Arial;
    background: #f4f6f8;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
  }

  button {
    padding: 8px 12px;
    margin: 5px;
    cursor: pointer;
  }

  table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
  }

  th {
    background: #007bff;
    color: white;
  }

  .total {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
  }

  #pages button {
    padding: 5px 10px;
    border: none;
    margin: 2px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="container">

<h2>Expense Report</h2>

<button onclick="generateReport(1)">Load Report</button>
<button onclick="downloadReport()">Download</button>

<div style="margin-top:15px;">
  <button onclick="prevPage()">Prev</button>
  <span id="pages"></span>
  <button onclick="nextPage()">Next</button>
</div>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Category</th>
      <th>Expense (₹)</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<div class="total" id="total"></div>

</div>

<script>
let currentPage = 1;
let totalPages = 1;
const limit = 3;

async function generateReport(page) {

  const url = `http://localhost:3000/expense/${page}/${limit}`;

  console.log("Fetching:", url);

  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${localStorage.getItem("token")}`
    }
  });

  const data = await res.json();

  console.log("Response:", data);

  const expenses = data.data || [];

  currentPage = data.currentPage;
  totalPages = data.totalPages;

  let rows = "";
  let total = 0;

  expenses.forEach(exp => {
    total += Number(exp.amount);

    rows += `
      <tr>
        <td>${new Date(exp.createdAt).toLocaleDateString()}</td>
        <td>${exp.description}</td>
        <td>${exp.category}</td>
        <td>${exp.amount}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = rows;
  document.getElementById("total").innerText = "Total: ₹ " + total;

  renderPages();
}

function renderPages() {
  let html = "";

  for (let i = 1; i <= totalPages; i++) {
    html += `
      <button onclick="goToPage(${i})"
        style="
          background:${i === currentPage ? '#007bff' : '#eee'};
          color:${i === currentPage ? 'white' : 'black'};
        ">
        ${i}
      </button>
    `;
  }

  document.getElementById("pages").innerHTML = html;
}

function goToPage(page) {
  generateReport(page);
}

function nextPage() {
  if (currentPage < totalPages) {
    generateReport(currentPage + 1);
  }
}

function prevPage() {
  if (currentPage > 1) {
    generateReport(currentPage - 1);
  }
}

function downloadReport() {
  const rows = document.querySelectorAll("#table tr");

  if (rows.length === 0) {
    alert("No data to download");
    return;
  }

  let csv = "Date,Description,Category,Expense\n";

  rows.forEach(row => {
    const cols = row.querySelectorAll("td");

    const rowData = Array.from(cols)
      .map(col => `"${col.innerText}"`)
      .join(",");

    csv += rowData + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = window.URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "expense-report.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

</script>

</body>
</html>
